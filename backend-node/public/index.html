<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Container -->
  <div class="chat-container">
    <!-- Header Title -->
    <h1 class="chat-header-title">Gemini AI Chatbot</h1>

    <!-- Chat Messages Box -->
    <div class="chat-box" id="chatMessages"></div>

    <!-- File Attachment Preview Bar (Muncul saat melampirkan berkas) -->
    <div class="attachment-preview" id="attachmentPreview" style="display: none;">
      <div class="preview-info">
        <span class="file-icon">📎</span>
        <span class="file-name" id="previewFileName">gambar.jpg</span>
        <span class="file-size" id="previewFileSize">0 KB</span>
      </div>
      <button type="button" class="btn-remove-file" id="btnRemoveFile" title="Hapus lampiran">&times;</button>
    </div>

    <!-- Input Area Form -->
    <form class="chat-input-form" id="chatForm">
      <input type="file" id="fileInput" class="hidden-file-input" accept="image/*,application/pdf,audio/*,.txt">

      <!-- Tombol Lampiran Berkas (Multimodal) -->
      <button type="button" class="btn-attach" id="btnAttach" title="Lampirkan File (Gambar/PDF/Audio)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
      </button>

      <!-- Input Text Field -->
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Type your message..." 
        autocomplete="off"
        required
      />

      <!-- Tombol Send -->
      <button type="submit" class="btn-send" id="btnSend">Send</button>
    </form>

    <!-- Subtle Status Badge -->
    <div class="status-footer">
      <span class="status-dot online"></span>
      <span id="statusText">Server Siap</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
